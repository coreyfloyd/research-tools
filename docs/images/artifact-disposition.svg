<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Research artifact disposition lifecycle</title>
  <desc id="desc">A question and its evidence become a durable staging report. After review and approval, each item is integrated into documents, compiled into an optional wiki, filed as follow-up work, or discarded. When all items have a terminal disposition, the staging report is deleted.</desc>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17212b;
      --dim: #5d6975;
      --line: #aeb8c2;
      --source: #0284c7;
      --source-bg: #e0f2fe;
      --staging: #c2410c;
      --staging-bg: #ffedd5;
      --action: #047857;
      --action-bg: #d1fae5;
      --off: #64748b;
      --off-bg: #f1f5f9;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15191d;
        --panel: #22282e;
        --ink: #f0f2f5;
        --dim: #a2abb5;
        --line: #59636e;
        --source: #38bdf8;
        --source-bg: #102f3f;
        --staging: #fb923c;
        --staging-bg: #402719;
        --action: #34d399;
        --action-bg: #14382e;
        --off: #94a3b8;
        --off-bg: #29313a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #15191d;
      --panel: #22282e;
      --ink: #f0f2f5;
      --dim: #a2abb5;
      --line: #59636e;
      --source: #38bdf8;
      --source-bg: #102f3f;
      --staging: #fb923c;
      --staging-bg: #402719;
      --action: #34d399;
      --action-bg: #14382e;
      --off: #94a3b8;
      --off-bg: #29313a;
    }
    :root[data-theme="light"] {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17212b;
      --dim: #5d6975;
      --line: #aeb8c2;
      --source: #0284c7;
      --source-bg: #e0f2fe;
      --staging: #c2410c;
      --staging-bg: #ffedd5;
      --action: #047857;
      --action-bg: #d1fae5;
      --off: #64748b;
      --off-bg: #f1f5f9;
    }
    .node { fill: var(--panel); stroke-width: 2.2; }
    .outcome { fill: var(--action-bg); stroke: var(--action); stroke-width: 1.5; }
    .discard { fill: var(--off-bg); stroke: var(--off); stroke-width: 1.5; }
    .label { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
    .heading { fill: var(--ink); font-family: var(--sans); font-size: 22px; font-weight: 750; }
    .input-heading { fill: var(--ink); font-family: var(--sans); font-size: 16.5px; font-weight: 750; }
    .card-heading { fill: var(--ink); font-family: var(--sans); font-size: 18px; font-weight: 750; }
    .terminal-heading { fill: var(--ink); font-family: var(--sans); font-size: 20px; font-weight: 750; }
    .copy { fill: var(--dim); font-family: var(--sans); font-size: 14px; }
    .small { fill: var(--dim); font-family: var(--sans); font-size: 12.5px; }
    .edge { fill: none; stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); }
    .action-edge { fill: none; stroke: var(--action); stroke-width: 1.8; marker-end: url(#action-arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="var(--line)"/>
    </marker>
    <marker id="action-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="var(--action)"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="20" fill="var(--bg)"/>
  <text x="40" y="48" class="heading">A report is a staging ground, not a permanent home</text>
  <text x="40" y="75" class="copy">Every proposed action must reach a terminal disposition.</text>

  <rect x="42" y="124" width="210" height="94" rx="13" fill="var(--source-bg)" stroke="var(--source)" stroke-width="2"/>
  <text x="62" y="157" class="label" fill="var(--source)">INPUT</text>
  <text x="62" y="185" class="input-heading">Question + evidence</text>
  <text x="62" y="205" class="small">sources, scope, decision</text>

  <rect x="340" y="124" width="224" height="94" rx="13" fill="var(--staging-bg)" stroke="var(--staging)" stroke-width="2.2"/>
  <text x="360" y="157" class="label" fill="var(--staging)">OUTPUT/REPORT.MD</text>
  <text x="360" y="185" class="card-heading">Durable staging report</text>
  <text x="360" y="205" class="small">answer, evidence, gaps, plan</text>

  <rect x="652" y="124" width="216" height="94" rx="13" class="node" stroke="var(--action)"/>
  <text x="672" y="157" class="label" fill="var(--action)">APPROVAL GATE</text>
  <text x="672" y="185" class="card-heading">Review the plan</text>
  <text x="672" y="205" class="small">approve, revise, or reject rows</text>

  <rect x="936" y="112" width="222" height="118" rx="14" fill="var(--panel)" stroke="var(--action)" stroke-width="2.4"/>
  <text x="956" y="146" class="label" fill="var(--action)">DISPOSITION</text>
  <text x="956" y="177" class="card-heading">Execute approved rows</text>
  <text x="956" y="202" class="copy">Nothing remains merely staged.</text>

  <path d="M252,171 L340,171" class="edge"/>
  <path d="M564,171 L652,171" class="edge"/>
  <path d="M868,171 L936,171" class="edge"/>

  <rect x="80" y="308" width="226" height="74" rx="11" class="outcome"/>
  <text x="98" y="338" class="card-heading">Update documents</text>
  <text x="98" y="362" class="small">integrate durable knowledge</text>

  <rect x="352" y="308" width="226" height="74" rx="11" class="outcome"/>
  <text x="370" y="338" class="card-heading">Compile the wiki</text>
  <text x="370" y="362" class="small">only when the wiki is enabled</text>

  <rect x="624" y="308" width="226" height="74" rx="11" class="outcome"/>
  <text x="642" y="338" class="card-heading">File follow-up work</text>
  <text x="642" y="362" class="small">route action to its owner</text>

  <rect x="896" y="308" width="226" height="74" rx="11" class="discard"/>
  <text x="914" y="338" class="card-heading">Discard</text>
  <text x="914" y="362" class="small">record that nothing is retained</text>

  <path d="M990,230 C990,266 193,266 193,308" class="action-edge"/>
  <path d="M1026,230 C1026,278 465,278 465,308" class="action-edge"/>
  <path d="M1062,230 C1062,290 737,290 737,308" class="action-edge"/>
  <path d="M1098,230 C1098,302 1009,302 1009,308" class="action-edge"/>

  <rect x="274" y="456" width="652" height="70" rx="13" fill="var(--staging-bg)" stroke="var(--staging)" stroke-width="2.2"/>
  <text x="302" y="486" class="label" fill="var(--staging)">CLOSE THE LOOP</text>
  <text x="302" y="512" class="terminal-heading">All rows terminal → delete the staging report</text>

  <path d="M193,382 C193,422 406,422 406,456" class="edge"/>
  <path d="M465,382 C465,422 536,422 536,456" class="edge"/>
  <path d="M737,382 C737,422 664,422 664,456" class="edge"/>
  <path d="M1009,382 C1009,422 794,422 794,456" class="edge"/>
</svg>
